# Internal Nginx for the admin CRM container. The outer nginx_proxy terminates
# TLS and proxies admin.<domain> here. SPA fallback so client-side routes
# resolve on refresh/deep-link.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
