# Internal Nginx for the player portal container. The outer nginx_proxy
# terminates TLS and proxies app.<domain> here. SPA fallback so client-side
# routes (e.g. /bets, /wallet) resolve on refresh/deep-link.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets; never cache index.html.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
